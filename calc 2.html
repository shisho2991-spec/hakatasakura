<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>人件費計算</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#ffffff;--surface2:#f2f3f5;--border:#dfe1e6;
  --ink:#14161a;--muted:#33363d;--muted2:#585c66;
  --accent:#2563eb;--accent-soft:#eaf1ff;
  --green:#16a34a;--red:#e11d2e;--orange:#e08600;
}
html{color-scheme:light !important;background:#ffffff !important;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter','Noto Sans JP',sans-serif;background:#ffffff !important;color:#14161a !important;min-height:100vh;padding:0 24px 60px;}
.header{padding:56px 0 8px;}
.header .eyebrow{font-size:0.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.header h1{font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;line-height:1.05;font-family:'Noto Sans JP',sans-serif;}
.sync-status{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:0.66rem;color:var(--muted2);font-weight:500;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.loading{background:var(--orange);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.section{margin:28px 0;}
.section-label{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-bottom:14px;}
.hairline{border:none;border-top:1px solid var(--border);margin:28px 0;}
select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:15px 16px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none;font-weight:600;}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'↓';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink);pointer-events:none;font-weight:700;}
.pin-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:15px;color:var(--ink);font-family:'DM Mono',monospace;font-size:1.3rem;text-align:center;letter-spacing:.5em;outline:none;}
input[type="number"],input[type="time"],input[type="date"]{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:13px 30px 13px 14px;color:var(--ink);font-family:'DM Mono',monospace;font-size:0.95rem;outline:none;-moz-appearance:textfield;-webkit-appearance:none;}
input[type="time"],input[type="date"]{padding-right:14px;}
input[type="number"]::-webkit-inner-spin-button{display:none;}
input:focus{border-color:var(--accent);}
select:focus,.pin-input:focus{border-color:var(--accent);}
.field label{display:block;font-size:0.66rem;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.input-wrap{position:relative;}
.input-wrap .unit{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:0.72rem;pointer-events:none;font-weight:600;}
.primary-btn{width:100%;padding:17px;background:var(--accent);border:none;border-radius:99px;color:#fff;font-size:0.92rem;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:transform .1s,opacity .15s;letter-spacing:.02em;}
.primary-btn:active{transform:scale(.98);opacity:.85;}
.primary-btn:disabled{opacity:.35;}
.outline-btn{width:100%;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:99px;color:var(--ink);font-size:0.9rem;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.dash-btn{width:100%;padding:14px;background:transparent;border:1px dashed var(--border);border-radius:99px;color:var(--muted);font-size:0.82rem;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:700;}
.text-btn{background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:600;text-decoration:underline;display:block;margin:20px auto 0;}
.hint-text{font-size:0.74rem;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7;}
.err-text{font-size:0.76rem;color:var(--red);text-align:center;min-height:18px;margin-top:8px;font-weight:600;}
.login-row{display:flex;flex-direction:column;gap:12px;}
.no-data{text-align:center;color:var(--muted2);font-size:0.82rem;padding:48px 0;font-weight:500;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.loading-overlay.show{display:flex;}
.loading-box{text-align:center;font-size:0.85rem;color:var(--muted);font-weight:600;}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

.sales-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.effective-sales{margin-top:16px;padding:16px 18px;background:var(--accent-soft);border-radius:12px;display:flex;justify-content:space-between;align-items:baseline;}
.effective-sales .elabel{font-size:0.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.15em;}
.effective-sales .val{font-family:'DM Mono',monospace;font-size:1.4rem;font-weight:700;color:var(--accent);}
.formula-note{font-size:0.64rem;color:var(--muted2);margin-top:10px;font-family:'DM Mono',monospace;}
.shift-item{border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;margin-bottom:12px;}
.shift-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.staff-num{font-family:'DM Mono',monospace;font-size:0.7rem;font-weight:600;color:var(--muted2);width:20px;}
.shift-select-wrap{flex:1;position:relative;}
.shift-select-wrap::after{content:'↓';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink);pointer-events:none;font-size:0.8rem;font-weight:700;}
.shift-select-wrap select{padding:11px 12px;font-size:0.9rem;border:1px solid var(--border);}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.cost-breakdown{border-top:1px solid var(--border);padding-top:10px;font-size:0.76rem;}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}
.breakdown-row .bl{color:var(--muted);}
.breakdown-row .bv{font-family:'DM Mono',monospace;font-weight:600;}
.breakdown-row.total{margin-top:4px;padding-top:8px;border-top:1px solid var(--border);font-weight:700;}
.breakdown-row.total .bv{font-size:1rem;}
.night-tag{color:var(--orange);font-size:0.62rem;margin-left:4px;font-weight:700;}
.round-tag{font-size:0.6rem;color:var(--muted2);font-weight:600;margin-left:8px;text-transform:none;letter-spacing:0;}
.remove-shift-btn{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;color:var(--muted2);font-size:0.85rem;padding:4px;}
.result-block{border-top:2px solid var(--accent);padding-top:20px;margin-top:24px;}
.result-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;}
.result-row .rl{font-size:0.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.12em;}
.result-row .rv{font-family:'DM Mono',monospace;font-size:1.05rem;font-weight:500;}
.rate-display{padding:18px 0 8px;}
.rate-display .big{font-family:'DM Mono',monospace;font-size:4rem;font-weight:500;line-height:1;letter-spacing:-0.03em;}
.rate-display .pct{font-size:1.4rem;color:var(--muted);}
.rate-display .cap{font-size:0.62rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin-bottom:8px;}
.gauge-bg{height:3px;background:var(--surface2);overflow:hidden;margin-top:14px;}
.gauge-fill{height:100%;transition:width .5s ease,background .5s ease;}
.live-tag{display:inline-flex;align-items:center;gap:5px;font-size:0.62rem;color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-left:8px;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite;}
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Labor Cost</div>
  <h1>人件費計算</h1>
  <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncText">接続中...</span></div>
</div>

<div class="section">
  <div class="section-label">日付</div>
  <input type="date" id="recordDate">
  <button class="outline-btn" style="margin-top:12px;" onclick="loadPunchData()">この日の打刻データを読み込む</button>
</div>

<div class="section">
  <div class="section-label">売上入力</div>
  <div class="sales-row">
    <div class="field"><label>現金</label><div class="input-wrap"><input type="number" id="cash" placeholder="0" oninput="calc()"><span class="unit">円</span></div></div>
    <div class="field"><label>クレジット</label><div class="input-wrap"><input type="number" id="credit" placeholder="0" oninput="calc()"><span class="unit">円</span></div></div>
  </div>
  <div class="effective-sales"><span class="elabel">有効売上</span><span class="val" id="effectiveSales">¥0</span></div>
  <div class="formula-note">(現金 + クレジット) ÷ 1.1</div>
</div>

<div class="section">
  <div class="section-label">バイト人件費<span class="round-tag">出勤は次の00分に切上げ</span><span class="live-tag" id="liveTag" style="display:none;"><span class="live-dot"></span>LIVE</span></div>
  <div id="shiftList"></div>
  <button class="dash-btn" onclick="addShift()">＋ 手動でバイトを追加</button>
</div>

<div class="result-block">
  <div class="rate-display">
    <div class="cap">人件費率</div>
    <span class="big" id="laborRatePct">—</span><span class="pct">%</span>
    <div class="gauge-bg"><div class="gauge-fill" id="gaugeFill" style="width:0%;background:var(--accent)"></div></div>
  </div>
  <div class="result-row"><span class="rl">総人件費</span><span class="rv" id="totalLaborVal">¥0</span></div>
  <div class="result-row"><span class="rl">有効売上</span><span class="rv" id="totalSalesVal">¥0</span></div>
</div>
<button class="primary-btn" style="margin-top:24px;" onclick="saveRecord()">この計算を履歴に保存</button>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><div id="loadingText">処理中...</div></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2HcmMd4W5k2S28-fl1Du8nW15NhSjnG_9LtF4ai2LqBvlIX_KVCU69_snsXv3crSnng/exec';

let staffMaster = [];
let shiftCount = 0;
const shiftData = {};

(function(){
  const d = new Date();
  document.getElementById('recordDate').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();

function setSyncStatus(state, text) {
  document.getElementById('syncDot').className = 'sync-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncText').textContent = text;
}
function showLoading(t){document.getElementById('loadingText').textContent=t||'処理中...';document.getElementById('loadingOverlay').classList.add('show');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show');}
async function gasGet(q){const r=await fetch(GAS_URL+'?'+q);return await r.json();}
async function gasPost(b){const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(b)});return await r.json();}

async function init() {
  setSyncStatus('loading','接続中...');
  try {
    const data = await gasGet('action=getStaff');
    staffMaster = data.staff || [];
    setSyncStatus('ok','同期済み');
  } catch(e) {
    setSyncStatus('error','接続エラー');
  }
  addShift();
}

function roundUpHour(t) {
  const p = t.split(':');
  let h = parseInt(p[0]), m = parseInt(p[1]);
  if (m > 0) { h++; m = 0; }
  return String(h%24).padStart(2,'0') + ':00';
}

async function loadPunchData() {
  const date = document.getElementById('recordDate').value;
  if (!date) { alert('日付を選択してください'); return; }
  showLoading('打刻データを読み込み中...');
  try {
    const r = await gasGet('action=getTimeclock&date='+date);
    hideLoading();
    const recs = (r.records||[]);
    if (recs.length === 0) { alert('この日の打刻データはありません'); return; }
    const now = new Date();
    const nowStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    document.getElementById('shiftList').innerHTML='';
    for(const id in shiftData) delete shiftData[id];
    shiftCount = 0;
    let workingCount = 0;
    recs.forEach(rec => {
      addShift();
      const sid = shiftCount;
      const staff = staffMaster.find(s=>s.name===rec.name);
      const roundedIn = roundUpHour(rec.in);
      const endTime = rec.out || nowStr;
      if (!rec.out) workingCount++;
      shiftData[sid].live = !rec.out;
      shiftData[sid].name = rec.name;
      shiftData[sid].wage = staff ? staff.wage : 0;
      shiftData[sid].start = roundedIn;
      shiftData[sid].end = endTime;
      const sel=document.querySelector('#shift-'+sid+' .shift-select');
      if(sel) sel.value = rec.name;
      const ti=document.querySelectorAll('#shift-'+sid+' input[type=time]');
      if(ti[0]) ti[0].value = roundedIn;
      if(ti[1]) ti[1].value = endTime;
      updateShift(sid);
    });
    calc();
    document.getElementById('liveTag').style.display = workingCount > 0 ? 'inline-flex' : 'none';
    if (workingCount > 0) {
      alert('勤務中のスタッフ' + workingCount + '名は現在時刻（' + nowStr + '）までで計算中です。\n1分ごとに自動でリアルタイム更新されます。\n時間を手動で変更することもできます（打刻データは変わりません）');
    }
  } catch(e) {
    hideLoading();
    alert('読み込みに失敗しました');
  }
}

// 勤務中シフトのリアルタイム更新（毎分）
setInterval(() => {
  const d = new Date();
  const nowStr = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  let anyLive = false;
  for (const id in shiftData) {
    if (shiftData[id].live) {
      anyLive = true;
      shiftData[id].end = nowStr;
      const ti = document.querySelectorAll('#shift-' + id + ' input[type=time]');
      if (ti[1]) ti[1].value = nowStr;
      updateShift(id);
    }
  }
  document.getElementById('liveTag').style.display = anyLive ? 'inline-flex' : 'none';
}, 60000);

function rebuildSelect(sel){
  const v=sel.value;
  sel.innerHTML='<option value="">選択</option>'+staffMaster.map(s=>'<option value="'+s.name+'">'+s.name+'</option>').join('');
  sel.value=v;
}
function addShift(){
  shiftCount++;const id=shiftCount;
  shiftData[id]={name:'',wage:0,start:'',end:'',live:false,computed:{total:0}};
  const opts='<option value="">選択</option>'+staffMaster.map(s=>'<option value="'+s.name+'">'+s.name+'　¥'+s.wage+'</option>').join('');
  const el=document.createElement('div');el.className='shift-item';el.id='shift-'+id;
  el.innerHTML=
    '<div class="shift-header"><span class="staff-num">'+String(id).padStart(2,'0')+'</span>'+
    '<div class="shift-select-wrap"><select class="shift-select" onchange="onSelectStaff('+id+',this.value)">'+opts+'</select></div></div>'+
    '<button class="remove-shift-btn" onclick="removeShift('+id+')">✕</button>'+
    '<div class="time-grid">'+
      '<div class="field"><label>出勤</label><input type="time" oninput="shiftData['+id+'].start=this.value;updateShift('+id+')"></div>'+
      '<div class="field"><label>退勤</label><input type="time" oninput="shiftData['+id+'].end=this.value;shiftData['+id+'].live=false;updateShift('+id+')"></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;">'+
      '<span style="font-size:0.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;">稼働時間</span>'+
      '<span id="hours-'+id+'" style="font-family:DM Mono,monospace;font-size:0.88rem;font-weight:600;">—</span>'+
    '</div>';
  document.getElementById('shiftList').appendChild(el);calc();
}
function onSelectStaff(id,name){
  const s=staffMaster.find(x=>x.name===name);
  shiftData[id].name=name;shiftData[id].wage=s?s.wage:0;updateShift(id);
}
function removeShift(id){const el=document.getElementById('shift-'+id);if(el)el.remove();delete shiftData[id];calc();}

function toMin(t){if(!t)return null;const p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
function calcWage(wage,startStr,endStr){
  const s=toMin(startStr),e0=toMin(endStr);
  if(s===null||e0===null||wage===0)return{normal:0,night:0,total:0,hours:0,normalHours:0,nightHours:0};
  let e=e0<=s?e0+1440:e0;
  const totalMins=e-s,ns=22*60,ne=29*60;
  const nightMins=Math.max(0,Math.min(e,ne)-Math.max(s,ns));
  const normalMins=totalMins-nightMins;
  return{normal:normalMins/60*wage,night:nightMins/60*wage*1.25,total:normalMins/60*wage+nightMins/60*wage*1.25,hours:totalMins/60,normalHours:normalMins/60,nightHours:nightMins/60};
}
function updateShift(id){
  const d=shiftData[id];if(!d)return;
  const r=calcWage(d.wage,d.start,d.end);d.computed=r;
  const hEl=document.getElementById('hours-'+id);
  if(hEl)hEl.textContent=r.hours>0?(r.hours.toFixed(2)+'h'+(r.nightHours>0?' (深夜'+r.nightHours.toFixed(2)+'h)':'')):'—';
  calc();
}
function fmt(n){return Math.round(n).toLocaleString('ja-JP');}
function calc(){
  const cash=+document.getElementById('cash').value||0;
  const credit=+document.getElementById('credit').value||0;
  const es=(cash+credit)/1.1;
  document.getElementById('effectiveSales').textContent='¥'+fmt(es);
  document.getElementById('totalSalesVal').textContent='¥'+fmt(es);
  let total=0;
  for(const id in shiftData)total+=(shiftData[id].computed?shiftData[id].computed.total:0);
  document.getElementById('totalLaborVal').textContent='¥'+fmt(total);
  if(es>0&&total>0){
    const rate=total/es*100;
    document.getElementById('laborRatePct').textContent=rate.toFixed(1);
    const pct=Math.min(rate,60);
    const fill=document.getElementById('gaugeFill');
    fill.style.width=(pct/60*100)+'%';
    fill.style.background=rate<=25?'var(--green)':rate<=35?'var(--orange)':'var(--red)';
  } else {
    document.getElementById('laborRatePct').textContent='—';
    document.getElementById('gaugeFill').style.width='0%';
  }
}

async function saveRecord(){
  const cash=+document.getElementById('cash').value||0;
  const credit=+document.getElementById('credit').value||0;
  const es=(cash+credit)/1.1;
  let total=0;const staffList=[];
  for(const id in shiftData){
    const d=shiftData[id];
    if(d.name){total+=(d.computed?d.computed.total:0);staffList.push({name:d.name,wage:d.wage,start:d.start,end:d.end,hours:d.computed?d.computed.hours:0,pay:d.computed?d.computed.total:0});}
  }
  if(staffList.length===0){alert('バイトを1人以上追加してください');return;}
  const date=document.getElementById('recordDate').value||new Date().toISOString().slice(0,10);
  const record={id:Date.now(),date,cash,credit,effectiveSales:es,totalLabor:total,rate:es>0?total/es*100:0,staff:staffList};
  showLoading('履歴を保存中...');
  try {
    await gasPost({action:'saveHistory', record});
    hideLoading();
    alert('履歴に保存しました');
  } catch(e) {
    hideLoading();
    alert('通信エラーが発生しました');
  }
}

init();
</script>
</body>
</html>
