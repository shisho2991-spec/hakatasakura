<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>マイページ｜給与確認</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#ffffff;--surface2:#f2f3f5;--border:#dfe1e6;
  --ink:#14161a;--muted:#33363d;--muted2:#585c66;
  --accent:#2563eb;--accent-soft:#eaf1ff;
  --green:#16a34a;--red:#e11d2e;--orange:#e08600;
}
html{color-scheme:light !important;background:#ffffff !important;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter','Noto Sans JP',sans-serif;background:#ffffff !important;color:#14161a !important;min-height:100vh;padding:0 24px 60px;}
.header{padding:56px 0 8px;}
.header .eyebrow{font-size:0.62rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.header h1{font-size:1.9rem;font-weight:900;letter-spacing:-0.03em;line-height:1.05;font-family:'Noto Sans JP',sans-serif;}
.sync-status{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:0.66rem;color:var(--muted2);font-weight:500;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.loading{background:var(--orange);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.section{margin:28px 0;}
.section-label{font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-bottom:14px;}
.hairline{border:none;border-top:1px solid var(--border);margin:28px 0;}
select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:15px 16px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;font-size:1rem;outline:none;-webkit-appearance:none;appearance:none;font-weight:600;}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'↓';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink);pointer-events:none;font-weight:700;}
.pin-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:15px;color:var(--ink);font-family:'DM Mono',monospace;font-size:1.3rem;text-align:center;letter-spacing:.5em;outline:none;}
input[type="number"],input[type="time"],input[type="date"]{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:13px 30px 13px 14px;color:var(--ink);font-family:'DM Mono',monospace;font-size:0.95rem;outline:none;-moz-appearance:textfield;-webkit-appearance:none;}
input[type="time"],input[type="date"]{padding-right:14px;}
input[type="number"]::-webkit-inner-spin-button{display:none;}
input:focus{border-color:var(--accent);}
select:focus,.pin-input:focus{border-color:var(--accent);}
.field label{display:block;font-size:0.66rem;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;}
.input-wrap{position:relative;}
.input-wrap .unit{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:0.72rem;pointer-events:none;font-weight:600;}
.primary-btn{width:100%;padding:17px;background:var(--accent);border:none;border-radius:99px;color:#fff;font-size:0.92rem;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:transform .1s,opacity .15s;letter-spacing:.02em;}
.primary-btn:active{transform:scale(.98);opacity:.85;}
.primary-btn:disabled{opacity:.35;}
.outline-btn{width:100%;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:99px;color:var(--ink);font-size:0.9rem;font-weight:700;font-family:'Noto Sans JP',sans-serif;cursor:pointer;}
.dash-btn{width:100%;padding:14px;background:transparent;border:1px dashed var(--border);border-radius:99px;color:var(--muted);font-size:0.82rem;font-family:'Noto Sans JP',sans-serif;cursor:pointer;font-weight:700;}
.text-btn{background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:600;text-decoration:underline;display:block;margin:20px auto 0;}
.hint-text{font-size:0.74rem;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7;}
.err-text{font-size:0.76rem;color:var(--red);text-align:center;min-height:18px;margin-top:8px;font-weight:600;}
.login-row{display:flex;flex-direction:column;gap:12px;}
.no-data{text-align:center;color:var(--muted2);font-size:0.82rem;padding:48px 0;font-weight:500;}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.loading-overlay.show{display:flex;}
.loading-box{text-align:center;font-size:0.85rem;color:var(--muted);font-weight:600;}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

.user-chip{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;}
.user-chip .un{font-weight:900;font-size:1.5rem;letter-spacing:-0.02em;font-family:'Noto Sans JP',sans-serif;}
.user-chip .logout{background:none;border:none;color:var(--muted);font-size:0.72rem;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:600;text-decoration:underline;}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.month-nav button{background:var(--bg);border:1px solid var(--border);border-radius:99px;width:40px;height:40px;font-size:1rem;cursor:pointer;color:var(--ink);}
.month-label{font-weight:800;font-size:1rem;font-family:'DM Mono',monospace;letter-spacing:.05em;}
.earn-hero{padding:8px 0 24px;border-bottom:2px solid var(--accent);margin-bottom:8px;}
.earn-hero .eh-label{font-size:0.62rem;color:var(--muted);letter-spacing:.2em;margin-bottom:10px;font-weight:700;text-transform:uppercase;}
.earn-hero .eh-val{font-family:'DM Mono',monospace;font-size:3.4rem;font-weight:500;line-height:1;letter-spacing:-0.03em;}
.earn-hero .eh-sub{font-size:0.74rem;color:var(--muted);margin-top:12px;font-family:'DM Mono',monospace;}
.gauge-bg{height:3px;background:var(--surface2);overflow:hidden;}
.gauge-fill{height:100%;transition:width .5s ease,background .5s ease;}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);}
.rec-item:last-child{border-bottom:none;}
.rec-date{font-size:0.85rem;font-weight:800;}
.rec-time{font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;}
.rec-pay{font-family:'DM Mono',monospace;font-weight:600;font-size:0.98rem;}
.rec-pay.working{color:var(--green);font-size:0.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
.privacy-note{font-size:0.68rem;color:var(--muted2);text-align:center;margin-top:20px;line-height:1.8;}
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Personal</div>
  <h1>マイページ</h1>
  <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncText">接続中...</span></div>
</div>

<div id="loginBox">
  <div class="section">
    <div class="section-label">Login</div>
    <div class="login-row">
      <div class="sel-wrap">
        <select id="loginName" onchange="onLoginNameChange()"><option value="">名前を選択</option></select>
      </div>
      <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="loginPin" placeholder="PIN">
      <button class="primary-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
    </div>
    <div class="err-text" id="loginErr"></div>
    <div class="hint-text" id="loginHint">初めての方は名前を選んでPINを設定してください</div>
  </div>
</div>

<div id="mainBox" style="display:none;">
  <div class="user-chip">
    <span class="un" id="chipName"></span>
    <button class="logout" onclick="doLogout()">ログアウト</button>
  </div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">←</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">→</button>
  </div>
  <div class="earn-hero">
    <div class="eh-label">This Month</div>
    <div class="eh-val" id="monthTotal">¥0</div>
    <div class="eh-sub" id="monthMeta"></div>
    <div class="gauge-bg" style="margin-top:16px;">
      <div class="gauge-fill" id="goalGauge" style="width:0%;background:var(--accent)"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <span style="font-size:0.68rem;color:var(--muted);font-weight:600;" id="goalText">目標を設定する</span>
      <button class="text-btn" style="margin:0;font-size:0.68rem;" onclick="setGoal()">編集</button>
    </div>
    <div style="font-size:0.68rem;color:var(--muted2);margin-top:6px;font-family:'DM Mono',monospace;" id="forecastText"></div>
  </div>
  <div class="section">
    <div class="section-label">勤務記録</div>
    <div id="myRecords"><div class="no-data">読み込み中...</div></div>
  </div>
  <div class="privacy-note">この情報はPINでログインした本人にのみ表示されます<br>給与は実際の打刻時間（1分単位）で計算</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><div id="loadingText">処理中...</div></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2HcmMd4W5k2S28-fl1Du8nW15NhSjnG_9LtF4ai2LqBvlIX_KVCU69_snsXv3crSnng/exec';

let staffMaster = [];
let session = JSON.parse(localStorage.getItem('tcSession') || 'null');
let viewMonth = new Date();
let nameHasPin = null;

function setSyncStatus(state, text) {
  document.getElementById('syncDot').className = 'sync-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncText').textContent = text;
}
function showLoading(t){document.getElementById('loadingText').textContent=t||'処理中...';document.getElementById('loadingOverlay').classList.add('show');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('show');}
async function gasGet(q){const r=await fetch(GAS_URL+'?'+q);return await r.json();}
async function gasPost(b){const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(b)});return await r.json();}

async function init() {
  setSyncStatus('loading','接続中...');
  try {
    const data = await gasGet('action=getStaff');
    staffMaster = data.staff || [];
    setSyncStatus('ok','同期済み');
  } catch(e) {
    setSyncStatus('error','接続エラー');
  }
  const opts = '<option value="">名前を選択</option>' + staffMaster.map(s=>'<option value="'+s.name+'">'+s.name+'</option>').join('');
  document.getElementById('loginName').innerHTML = opts;
  if (session) restoreSession();
}

async function onLoginNameChange() {
  const name = document.getElementById('loginName').value;
  document.getElementById('loginErr').textContent = '';
  if (!name) return;
  document.getElementById('loginHint').textContent = '確認中...';
  try {
    const r = await gasPost({action:'pinStatus', name});
    nameHasPin = r.hasPin;
    if (r.hasPin) {
      document.getElementById('loginBtn').textContent = 'ログイン';
      document.getElementById('loginHint').textContent = 'PINを入力してログイン';
    } else {
      document.getElementById('loginBtn').textContent = 'PINを設定してはじめる';
      document.getElementById('loginHint').textContent = '初回ログインです。好きな4桁のPINを決めて入力してください';
    }
  } catch(e) {
    document.getElementById('loginHint').textContent = '通信エラー';
  }
}

async function doLogin() {
  const name = document.getElementById('loginName').value;
  const pin = document.getElementById('loginPin').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if (!name) { err.textContent = '名前を選択してください'; return; }
  if (!/^\d{4}$/.test(pin)) { err.textContent = 'PINは4桁の数字で入力してください'; return; }
  showLoading(nameHasPin === false ? 'PINを設定中...' : 'ログイン中...');
  try {
    if (nameHasPin === false) {
      const r = await gasPost({action:'setPin', name, pin});
      if (!r.ok) { hideLoading(); err.textContent = 'すでにPINが設定されています'; onLoginNameChange(); return; }
    } else {
      const r = await gasPost({action:'login', name, pin});
      if (!r.ok) { hideLoading(); err.textContent = 'PINが違います'; return; }
    }
    session = {name, pin};
    localStorage.setItem('tcSession', JSON.stringify(session));
    hideLoading();
    restoreSession();
  } catch(e) {
    hideLoading();
    err.textContent = '通信エラーが発生しました';
  }
}

function restoreSession() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainBox').style.display = 'block';
  document.getElementById('chipName').textContent = session.name;
  loadMyRecords();
}

function doLogout() {
  session = null;
  localStorage.removeItem('tcSession');
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('mainBox').style.display = 'none';
  document.getElementById('loginPin').value = '';
}

function changeMonth(diff) {
  viewMonth.setMonth(viewMonth.getMonth() + diff);
  loadMyRecords();
}

function toMin(t){if(!t)return null;const p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
function calcWage(wage,startStr,endStr){
  const s=toMin(startStr),e0=toMin(endStr);
  if(s===null||e0===null||wage===0)return{normal:0,night:0,total:0,hours:0,normalHours:0,nightHours:0};
  let e=e0<=s?e0+1440:e0;
  const totalMins=e-s,ns=22*60,ne=29*60;
  const nightMins=Math.max(0,Math.min(e,ne)-Math.max(s,ns));
  const normalMins=totalMins-nightMins;
  return{normal:normalMins/60*wage,night:nightMins/60*wage*1.25,total:normalMins/60*wage+nightMins/60*wage*1.25,hours:totalMins/60,normalHours:normalMins/60,nightHours:nightMins/60};
}
function fmt(n){return Math.round(n).toLocaleString('ja-JP');}
function fmtDate(d) { const p = d.split('-'); return p[1].replace(/^0/,'') + '/' + p[2].replace(/^0/,''); }

async function loadMyRecords() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth()+1;
  const monthStr = y + '-' + String(m).padStart(2,'0');
  document.getElementById('monthLabel').textContent = y + '.' + String(m).padStart(2,'0');
  const el = document.getElementById('myRecords');
  el.innerHTML = '<div class="no-data">読み込み中...</div>';
  try {
    const r = await gasPost({action:'myRecords', name:session.name, pin:session.pin, month:monthStr});
    if (!r.ok) { doLogout(); return; }
    const staff = staffMaster.find(s=>s.name===session.name);
    const wage = staff ? staff.wage : 0;
    let total = 0, totalH = 0, count = 0;
    let html = '';
    r.records.slice().reverse().forEach(rec => {
      if (rec.out) {
        const p = calcWage(wage, rec.in, rec.out);
        total += p.total; totalH += p.hours; count++;
        html += '<div class="rec-item"><div><div class="rec-date">'+fmtDate(rec.date)+'</div><div class="rec-time">'+rec.in+' – '+rec.out+' · '+p.hours.toFixed(2)+'h'+(p.nightHours>0?' · 深夜'+p.nightHours.toFixed(1)+'h':'')+'</div></div><div class="rec-pay">¥'+fmt(p.total)+'</div></div>';
      } else {
        html += '<div class="rec-item"><div><div class="rec-date">'+fmtDate(rec.date)+'</div><div class="rec-time">'+rec.in+' – 勤務中</div></div><div class="rec-pay working">On Duty</div></div>';
      }
    });
    el.innerHTML = html || '<div class="no-data">この月の勤務記録はありません</div>';
    document.getElementById('monthTotal').textContent = '¥' + fmt(total);
    document.getElementById('monthMeta').textContent = count + '回勤務 · ' + totalH.toFixed(1) + 'h · 時給¥' + fmt(wage);
    updateGoalUI(total, y, m);
  } catch(e) {
    el.innerHTML = '<div class="no-data">読み込みに失敗しました</div>';
  }
}

function goalKey() { return 'goal_' + session.name; }

function updateGoalUI(total, y, m) {
  const goal = +localStorage.getItem(goalKey()) || 0;
  const gauge = document.getElementById('goalGauge');
  const text = document.getElementById('goalText');
  const forecast = document.getElementById('forecastText');
  if (goal > 0) {
    const pct = Math.min(100, total / goal * 100);
    gauge.style.width = pct + '%';
    gauge.style.background = pct >= 100 ? 'var(--green)' : 'var(--ink)';
    text.textContent = '目標 ¥' + fmt(goal) + '（' + pct.toFixed(0) + '%達成）';
  } else {
    gauge.style.width = '0%';
    text.textContent = '目標を設定する';
  }
  const today = new Date();
  const isCurrentMonth = (today.getFullYear() === y && today.getMonth()+1 === m);
  if (isCurrentMonth && total > 0) {
    const dayOfMonth = today.getDate();
    const daysInMonth = new Date(y, m, 0).getDate();
    const dailyAvg = total / dayOfMonth;
    const forecastTotal = dailyAvg * daysInMonth;
    forecast.textContent = 'このペースなら月末までに約 ¥' + fmt(forecastTotal);
  } else {
    forecast.textContent = '';
  }
}

function setGoal() {
  const current = +localStorage.getItem(goalKey()) || '';
  const v = prompt('今月の目標給料を入力してください（円）', current || '');
  if (v === null) return;
  const num = +v;
  if (isNaN(num) || num < 0) { alert('正しい数字を入力してください'); return; }
  localStorage.setItem(goalKey(), num);
  loadMyRecords();
}

// ログイン中は勤怠修正の反映を見逃さないよう1分ごとに自動更新
setInterval(() => {
  if (session) loadMyRecords();
}, 60000);

init();
</script>
</body>
</html>
